<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centered Image</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; background: #000; }
    img { max-width: 90vw; max-height: 90vh; display: block; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 1rem; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: clamp(16px, 2.8vw, 28px); }
  </style>
  </head>
<body>
  <figure>
    <img src="e6c880eb891e940a1455d9be140df170.jpg" alt="Your image">
    <figcaption>GHOST ZEB HH</figcaption>
  </figure>
</body>
</html>
