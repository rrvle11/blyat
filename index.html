<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infos leaked yay</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; background: #000; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; overflow: hidden; }
    figure { margin: 0; display: grid; place-items: center; width: 100vw; height: 100vh; }
    video { width: 98vw; height: 95vh; object-fit: contain; display: block; }
    #ticker { position: fixed; inset: 0; pointer-events: none; }
    .line { position: fixed; top: -10vh; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800; font-size: clamp(14px, min(3.0vw, 3.4vh), 28px); text-align: center; -webkit-text-stroke: 0.7px #000; text-shadow: 0 0 3px rgba(0,0,0,.45); will-change: top; max-width: 92vw; }
    @keyframes fall {
      0%   { top: -10vh; opacity: 1 }
      100% { top: 110vh; opacity: 1 }
    }
    @keyframes flicker { 0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1 } 20%,24%,55% { opacity: .88 } }
    #playGate.gate { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #fff; font-size: clamp(22px, 4.4vw, 38px); font-weight: 800; text-shadow: 0 0 14px #ff3b3b, 0 0 28px #ff3b3b, 0 0 42px #ff3b3b; animation: glowPulse 1.6s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { text-shadow: 0 0 14px #ff3b3b, 0 0 28px #ff3b3b } 50% { text-shadow: 0 0 26px #ff7b7b, 0 0 52px #ff7b7b } }
  </style>
  </head>
<body>
  <figure>
    <video id="bgVideo" src="kurt.mp4" loop muted playsinline preload="auto" style="display:none"></video>
  </figure>
  <div id="ticker"></div>
  <audio id="bgAudio" src="doxxed.mp3" preload="auto" autoplay></audio>
  <div id="playGate" class="gate">Click me :3</div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var ticker = document.getElementById('ticker');
      var SPEED = 1000;
      var DUR = 4.5;
      var timeouts = [];
      var loopTimer = null;
      var running = false;
      function addLine(text, delay) {
        var id = setTimeout(function () {
          if (!running) return;
          var el = document.createElement('div');
          el.className = 'line';
          el.textContent = text;
          el.style.animation = 'fall '+DUR+'s linear forwards, flicker 1.1s steps(10, end) infinite';
          ticker.appendChild(el);
          el.addEventListener('animationend', function () { el.remove(); });
        }, delay || 0);
        timeouts.push(id);
      }
      function clearScheduled(){ for (var i=0;i<timeouts.length;i++){ clearTimeout(timeouts[i]); } timeouts = []; }
      function osName(){
        var ua = navigator.userAgent;
        if (/Windows NT/i.test(ua)) return "Windows";
        if (/(Macintosh|Mac OS X)/i.test(ua)) return "macOS";
        if (/Android/i.test(ua)) return "Android";
        if (/(iPhone|iPad|iPod)/i.test(ua)) return "iOS";
        if (/Linux/i.test(ua)) return "Linux";
        return "Unknown";
      }
      function browserName(){
        var ua = navigator.userAgent;
        if (/Edg\//.test(ua)) return "Edge";
        if (/Chrome\//.test(ua)) return "Chrome";
        if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
        if (/Firefox\//.test(ua)) return "Firefox";
        return "Browser";
      }
      function deviceNick(){ return (/Mobile|Android|iPhone/i.test(navigator.userAgent)) ? "Pocket rocket" : "Desk titan"; }
      function netType(){
        var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var raw = c ? (c.type || c.effectiveType || "") : "";
        if (/cell|2g|3g|4g|5g/i.test(raw)) return "Mobile";
        if (/wifi/i.test(raw)) return "WiFi";
        if (/ethernet/i.test(raw)) return "Ethernet";
        return "Unknown";
      }
      function netJoke(){
        var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var e = c ? c.effectiveType : "";
        var map = { "slow-2g": "Sleepy turtles", "2g": "Sunday sloth", "3g": "Caffeinated snails", "4g": "Caffeinated squirrel", "5g": "Warp speed" };
        return "Your internet is "+(map[e] || "feeling adventurous");
      }
      function fmt(n){ return Math.round(n*10)/10 }
      var step = SPEED;
      function queueAll(){
        fetch('https://api.ipify.org?format=json').then(function(r){return r.json()}).then(function(d){ addLine('IPv4: '+d.ip, 0); }).catch(function(){ addLine('IPv4: unknown', 0); });
        fetch('https://api64.ipify.org?format=json').then(function(r){return r.json()}).then(function(d){ addLine('IPv6: '+d.ip, step); }).catch(function(){ addLine('IPv6: unavailable', step); });
        addLine('Type: '+netType(), step*2);
        addLine(netJoke(), step*3);
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn && typeof conn.downlink === 'number') { addLine('Downlink: '+fmt(conn.downlink)+' Mbps', step*3.5); }
        if (conn && typeof conn.rtt === 'number') { addLine('RTT: '+fmt(conn.rtt)+' ms', step*3.8); }
        var w = window.screen.width, h = window.screen.height, dpr = window.devicePixelRatio || 1;
        addLine('Resolution: '+w+' × '+h, step*4);
        addLine('Pixel density: '+fmt(dpr)+'x', step*5);
        addLine('Your screen is sharper than a dragon\'s tooth', step*6);
        addLine('Viewport: '+window.innerWidth+' × '+window.innerHeight, step*6.5);
        addLine('Languages: '+((navigator.languages||[navigator.language]).join(', ')), step*7.2);
        addLine('CPU cores: '+(navigator.hardwareConcurrency||'?'), step*7.9);
        addLine('RAM approx: '+(navigator.deviceMemory||'?')+' GB', step*8.6);
        addLine('Cookies: '+(navigator.cookieEnabled?'enabled':'disabled'), step*9.3);
        try { var ref = document.referrer ? new URL(document.referrer).hostname : 'none'; addLine('Referrer: '+ref, step*10); } catch(e){ addLine('Referrer: none', step*10); }
        fetch('https://ipwho.is/').then(function(r){return r.json()}).then(function(x){
          var place = [x.city, x.country].filter(Boolean).join(', ') || 'somewhere';
          addLine('Place: '+place, step*11);
          var tz = (x.timezone && x.timezone.id) || Intl.DateTimeFormat().resolvedOptions().timeZone;
          var now = new Date();
          addLine('Local time: '+now.toLocaleString(undefined,{ timeZone: tz }), step*11.7);
          var isp = (x.connection && (x.connection.isp || x.connection.org || x.connection.domain)) || '';
          if (isp) addLine('ISP: '+isp, step*11.9);
          var asn = (x.connection && x.connection.asn) ? ('AS'+x.connection.asn) : '';
          if (asn) addLine('ASN: '+asn, step*12.1);
          var region = [x.region, x.country].filter(Boolean).join(', ');
          if (region) addLine('Region: '+region, step*12.2);
          if (x.postal) addLine('Postal code: '+x.postal, step*12.3);
          if (x.latitude && x.longitude){
            function haversine(lat1, lon1, lat2, lon2){
              var R = 6371, toRad = Math.PI/180;
              var dLat = (lat2-lat1)*toRad, dLon = (lon2-lon1)*toRad;
              var a = Math.sin(dLat/2)**2 + Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)**2;
              var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              return R*c;
            }
            var list = [
              {n:'Eiffel Tower',a:48.8584,b:2.2945},
              {n:'Statue of Liberty',a:40.6892,b:-74.0445},
              {n:'Burj Khalifa',a:25.1972,b:55.2744},
              {n:'Sydney Opera House',a:-33.8568,b:151.2153},
              {n:'Taj Mahal',a:27.1751,b:78.0421},
              {n:'Great Wall (Badaling)',a:40.4319,b:116.5704}
            ];
            var best=null, bd=1e9;
            for (var i=0;i<list.length;i++){ var d=haversine(x.latitude,x.longitude,list[i].a,list[i].b); if(d<bd){bd=d; best=list[i];} }
            var line = bd<50 ? 'so close you could borrow sugar' : bd<500 ? 'a comfy road-trip away' : bd<2000 ? 'two naps and a snack away' : 'on the other side of the map';
            addLine('Nearest: '+best.n+' — '+fmt(bd)+' km, '+line, step*12.4);
            var url = 'https://api.open-meteo.com/v1/forecast?latitude='+x.latitude+'&longitude='+x.longitude+'&current=temperature_2m,weather_code';
            fetch(url).then(function(r){return r.json()}).then(function(w){
              var cur = (w.current || w.current_weather || {});
              var code = cur.weather_code != null ? cur.weather_code : 0;
              var temp = cur.temperature_2m != null ? cur.temperature_2m : (cur.temperature || 20);
              var map = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Icy fog',51:'Drizzle',61:'Rain',71:'Snow',80:'Showers',95:'Thunderstorm'};
              var fun = temp>30 ? 'hotter than fresh toast' : temp>20 ? 'sunny like a good mood' : temp>10 ? 'mild as a friendly cat' : temp>0 ? 'crisp like apple bites' : 'colder than a penguin\'s picnic';
              addLine('Weather: '+(map[code]||'Weather doing its thing')+' at '+fmt(temp)+'°C, '+fun, step*13.1);
            }).catch(function(){ addLine('Weather: unavailable', step*13.1); });
          } else {
            addLine('Nearest landmark: estimating requires location', step*12.4);
            addLine('Weather: unavailable', step*13.1);
          }
        }).catch(function(){
          addLine('Place: somewhere on Earth', step*11);
          addLine('Local time: '+new Date().toLocaleString(), step*11.7);
          addLine('Nearest landmark: unavailable', step*12.4);
          addLine('Weather: unavailable', step*13.1);
        });
        addLine('OS: '+osName(), step*13.8);
        addLine('Browser: '+browserName()+' — '+deviceNick(), step*14.5);
        try {
          var canvas = document.createElement('canvas');
          var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            var vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : 'Unknown vendor';
            var renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'Unknown renderer';
            addLine('GPU: '+vendor+' / '+renderer, step*14.8);
          }
        } catch(e){}
        addLine('Timezone offset: '+(Math.round(-new Date().getTimezoneOffset()/60))+'h from UTC', step*15.2);
        addLine('Fun fact: your tabs are doing cardio', step*15.9);
        addLine('Systems nominal, caffeine levels adequate', step*16.6);
        if (navigator.getBattery) {
          navigator.getBattery().then(function(b){ addLine('Battery: '+Math.round(b.level*100)+'% '+(b.charging?'charging':'discharging'), step*17.3); });
        }
      }
      var a = document.getElementById('bgAudio'), gate = document.getElementById('playGate'), v = document.getElementById('bgVideo');
      a.volume = 0.8;
      gate.style.display = 'grid';
      var started = false;
      function start() {
        if (started) return;
        started = true;
        gate.style.display = 'none';
        try { a.play(); } catch(e){}
        try { v.style.display='block'; v.play(); } catch(e){}
        running = true;
        queueAll();
        var cycle = Math.ceil(step*18);
        loopTimer = setInterval(queueAll, cycle);
      }
      gate.addEventListener('click', start);
      document.addEventListener('visibilitychange', function(){
        if (document.hidden){
          running = false;
          clearScheduled();
          if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
        } else {
          if (started){
            running = true;
            queueAll();
            var cycle = Math.ceil(step*18);
            loopTimer = setInterval(queueAll, cycle);
          }
        }
      });
    });
  </script>
</body>
</html>
